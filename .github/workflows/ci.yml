name: CI Build

on:
  push:
    branches: [ main, solution ]
  pull_request:
    branches: [ main, solution ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Compile and Test
        run: sbt compile test
